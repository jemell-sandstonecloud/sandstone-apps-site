<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Hunchfile is a notebook for one-line ideas.">
<title>Hunchfile</title>
<style>:root{color-scheme:light dark;--paper:#F4F5EF;--ink:#15181A;--ink2:#4A5154;--rule:#C9CDC2;--link:#1D5F4C;--marker:#D6F05A}
@media (prefers-color-scheme:dark){:root{--paper:#111412;--ink:#F1F3EB;--ink2:#A9B0A6;--rule:#3A413A;--link:#BFE14D;--marker:#BFE14D}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
main,footer{max-width:640px;margin:0 auto;padding:0 20px}
main{padding-top:40px;padding-bottom:32px}
h1{font-size:28px;line-height:1.2;margin:0 0 16px;padding-bottom:8px;border-bottom:4px solid var(--marker)}
h2{font-size:19px;line-height:1.3;margin:32px 0 8px}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:22px}
li{margin:0 0 8px}
ul.nav{list-style:none;padding:0;margin:24px 0}
ul.nav li{margin:0;border-top:1px solid var(--rule)}
ul.nav li:last-child{border-bottom:1px solid var(--rule)}
ul.nav a{display:block;padding:13px 0;min-height:48px}
a{color:var(--link);text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
footer{padding-top:16px;padding-bottom:40px;border-top:1px solid var(--rule);color:var(--ink2);font-size:15px}
footer a{display:inline-block;padding:10px 0;margin-right:16px;min-height:44px}</style>
</head>
<body>
<main>
<h1>Hunchfile</h1>
<p>A notebook for one-line ideas.</p>

</main>
</body>
</html>
